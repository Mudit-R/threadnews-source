<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173e35">
  <title>You're offline — ThreadNews</title>
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <style>
    :root{color-scheme:light;--paper:#f8f9f5;--ink:#202e28;--green:#214c3f;--muted:#718071}
    *{box-sizing:border-box}
    body{min-height:100vh;margin:0;padding:28px;background:var(--paper);color:var(--ink);font:16px/1.6 "DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center}
    main{width:min(100%,430px);text-align:center}
    .mark{width:76px;height:76px;border-radius:22px;margin:0 auto 26px;background:#173e35;color:#d5ed8c;display:grid;place-items:center;font-weight:700;letter-spacing:-2px;font-size:25px}
    .eyebrow{color:var(--muted);font-size:11px;font-weight:700;letter-spacing:1.4px}
    h1{margin:14px 0 10px;font:500 clamp(38px,9vw,54px)/1.03 Georgia,serif;letter-spacing:-1.4px}
    p{margin:0 auto;color:var(--muted);font-size:14px;max-width:340px}
    a{display:inline-flex;justify-content:center;align-items:center;margin-top:28px;min-height:46px;padding:0 20px;border-radius:6px;background:var(--green);color:white;text-decoration:none;font-size:13px;font-weight:600}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">TN</div>
    <div class="eyebrow">THREADNEWS</div>
    <h1>You’re offline.</h1>
    <p>Reconnect to the internet to read the latest news and source-linked timelines.</p>
    <a href="/">Try again</a>
  </main>
</body>
</html>
